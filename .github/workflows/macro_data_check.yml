name: Data Fetch Check

on:
  # Scheduled as stage 1 of .github/workflows/pipeline.yml. Still dispatchable
  # on its own for an ad-hoc check that the upstream sources are alive — which
  # is also how you ask "is the vol feed back yet?" without writing a note.
  # Prefer `pipeline.yml` with mode=validate: same run, one entry point.
  workflow_call:
    inputs:
      strict_feeds:
        description: "Fail the run on a dead fragility vol leg (default: warn only)"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      strict_feeds:
        description: "Fail the run on a dead fragility vol leg (default: warn only)"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  data-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Macro-Assist
        uses: actions/checkout@v4
        with:
          path: macro-assist

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: macro-assist/.macro-assist/requirements.txt

      - name: Install dependencies
        run: pip install -r macro-assist/.macro-assist/requirements.txt

      # READ-ONLY, and load-bearing since todo #28. `validate_data` may now
      # carry a slow-moving critical series forward from the last snapshot
      # under `results/fred_snapshot/`, and `daily` is gated on THIS job
      # succeeding — so without the mount this stage would still abort on a
      # series the day's note would happily have carried, and the fix would
      # never fire in production. Nothing here publishes: `--fetch-only` writes
      # no files, and there is no `ci_publish_results.sh` step.
      - name: Mount output branch at results/
        working-directory: macro-assist
        run: bash .macro-assist/ci_mount_output.sh

      - name: Run data fetch check
        env:
          FRED_API_KEY:     ${{ secrets.FRED_API_KEY }}
          SUPADATA_API_KEY: ${{ secrets.SUPADATA_API_KEY }}
          # No ANTHROPIC_API_KEY — LLM is never called in --fetch-only mode
          # No VAULT_ROOT — fetch check does not write any files
        run: |
          python macro-assist/.macro-assist/collect_and_analyze.py --fetch-only \
            ${{ inputs.strict_feeds && '--strict-feeds' || '' }}
