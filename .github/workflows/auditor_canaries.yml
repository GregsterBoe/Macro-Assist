name: Auditor canaries (WP-25.A)

# The test of the independent auditor (ADR-0022). Runs `audit_entry.py
# --canaries`: a clean fictional register entry and six variants of it, each
# with one planted defect (a bar moved after the data, a sign scored as a hit
# rate, a look past the seal, a cell on two episodes, an uncounted run, a
# number that is not in the report). The auditor must report each planted
# defect as blocking and must NOT raise that category against the clean base,
# so an auditor that rejects everything fails too.
#
# CI runs it and CI records it, on purpose: the proposer running the suite and
# relaying "all canaries passed" is the same move ADR-0022 forbids for a
# promotion. The record lands on the output branch under results/audit/canaries/
# — a timestamped JSON with every finding, and latest.md.
#
# The switch (roadmap Phase 25): when WP-25.A–C are done and a run of this
# workflow passes on the current instructions and canary set, delete the
# "Until the auditor is switched on" subsection of how-we-explore §6.
#
# MANUAL ONLY. It costs API money: seven audits, about $2.80 at the default
# model and effort (claude-opus-5-5 / high; each record has its estimate).
# `max_usd` stops the suite before a runaway. Trigger: Actions tab -> this
# workflow -> Run.

on:
  workflow_dispatch:
    inputs:
      model:
        description: "Auditor model"
        type: string
        default: "claude-opus-5-5"
      effort:
        description: "Auditor effort (low / medium / high / xhigh / max)"
        type: string
        default: "high"
      max_usd:
        description: "Stop the suite once its estimated spend reaches this (USD)"
        type: string
        default: "5"
      publish:
        description: "Commit the record to the output branch"
        type: boolean
        default: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  canaries:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .macro-assist/requirements.txt

      - name: Install dependencies
        run: pip install -r .macro-assist/requirements.txt

      - name: Run the offline auditor tests first
        # The verdict rule, the canary replay and the scoring are code, and
        # tested; a defect there would make the paid run meaningless.
        run: python -m pytest .macro-assist/tests/test_audit_entry.py -q

      - name: Mount output branch at results/
        if: ${{ inputs.publish }}
        run: bash .macro-assist/ci_mount_output.sh

      - name: Run the canary suite
        id: suite
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          MAX_USD: ${{ inputs.max_usd }}
        run: |
          set +e
          python .macro-assist/audit_entry.py --canaries \
            --model "$MODEL" --effort "$EFFORT" --max-usd "$MAX_USD"
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          if [ -f results/audit/canaries/latest.md ]; then
            cat results/audit/canaries/latest.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # 0 = every canary passed, 1 = at least one failed. Anything else is
          # a crash; a failed suite is still published below, because a
          # negative is a result.
          [ "$status" -le 1 ]

      - name: Publish the record to the output branch
        if: ${{ inputs.publish && always() && steps.suite.outcome != 'skipped' }}
        run: |
          bash .macro-assist/ci_publish_results.sh \
            "auditor canaries: $(date -u +%Y-%m-%d) ${{ steps.suite.outputs.status == '0' && 'passed' || 'FAILED' }}"

      - name: Fail the job unless every canary passed
        if: ${{ steps.suite.outputs.status != '0' }}
        run: |
          echo "The canary suite did not pass (exit ${{ steps.suite.outputs.status }})."
          exit 1
