name: Kimi Arm Daily (experimental model A/B)

# Daily emission of the Kimi K2.6 ensemble arm (confidence from sample agreement,
# not self-report). Runs AFTER the Daily Macro Intelligence job has committed that
# day's payload preview, reads the SAME payload, ensembles it, and commits an
# `arm: kimi` note; the existing Weekly Scoring job then scores it → market vs
# exogenous vs kimi in calibration_by_arm.
#
# ┌─ MODULAR / removable (grep KIMI-ARM). ────────────────────────────────────────┐
# │ SOFT-KILL (stop it, zero risk): disable or delete THIS workflow — the market   │
# │ pipeline is untouched and the arm simply stops growing.                        │
# │ HARD-KILL: also delete .macro-assist/kimi_arm.py + tests/test_kimi_arm.py +    │
# │ the two kimi workflows + results/**/*-kimi-macro.md + results/scores/          │
# │ *__kimi.json. The arm-keying / calibration_by_arm hooks are generic (shared    │
# │ with the exogenous arm) — leave them.                                          │
# └────────────────────────────────────────────────────────────────────────────────┘
#
# Needs the MOONSHOT_API_KEY repo secret. Skips gracefully if the day's payload
# preview isn't present yet (nothing committed).

on:
  schedule:
    - cron: "5 7 * * 1-5"   # Mon–Fri 07:05 UTC, after the 06:30 market run commits the preview
  workflow_dispatch:
    inputs:
      asof:
        description: "Date (YYYY-MM-DD; blank = today) — needs a committed payload preview"
        type: string
        default: ""
      n:
        description: "Ensemble samples"
        type: string
        default: "12"
      force:
        description: "Overwrite an existing note for that date"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  emit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Macro-Assist
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .macro-assist/requirements.txt

      - name: Install dependencies
        run: pip install -r .macro-assist/requirements.txt

      - name: Emit Kimi ensemble note
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: |
          echo "::group::Kimi ensemble"
          python .macro-assist/kimi_arm.py \
            ${{ inputs.asof && format('--asof {0}', inputs.asof) || '' }} \
            --n "${{ inputs.n || '12' }}" \
            ${{ inputs.force && '--force' || '' }}
          echo "::endgroup::"

      - name: Commit Kimi note
        run: |
          set -e
          git config user.name  "macro-assist[bot]"
          git config user.email "macro-assist[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
          git add results/*/*-kimi-macro.md || true
          git diff --cached --quiet || git commit -m "kimi: $(date -u +%Y-%m-%d) ensemble arm note"
          git push origin HEAD
