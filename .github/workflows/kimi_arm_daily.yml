name: Kimi Arm Daily (experimental model A/B)

# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║ DEACTIVATED 2026-09-04 (WP-21.D). Removed from pipeline.yml as stage 4, so it  ║
# ║ no longer runs on its own. `workflow_dispatch` below still works if you want   ║
# ║ to fire it by hand.                                                           ║
# ║                                                                               ║
# ║ WHY: this arm's question was "can ensemble self-consistency calibrate          ║
# ║ `confidence_pct`, which [KB-007] found anti-informative?" v1.6 cut             ║
# ║ `confidence_pct` from the product entirely [KB-024] — no numeric model class   ║
# ║ can beat a constant on this payload — so the arm was accumulating a record     ║
# ║ about a column that no longer ships. Fixing the calibration of a signal that   ║
# ║ does not exist is not a smaller task, it is an empty one.                      ║
# ║                                                                               ║
# ║ This is the SOFT-KILL described below: nothing deleted. kimi_arm.py, its       ║
# ║ tests, the emitted notes and the scored history all stay, and                  ║
# ║ calibration_by_arm still reads them. Restore the stage in pipeline.yml to      ║
# ║ resume.                                                                       ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# Daily emission of the Kimi K2.6 ensemble arm (confidence from sample agreement,
# not self-report). Runs AFTER the Daily Macro Intelligence job has committed that
# day's payload preview, reads the SAME payload, ensembles it, and commits an
# `arm: kimi` note; the existing Weekly Scoring job then scores it → market vs
# exogenous vs kimi in calibration_by_arm.
#
# ┌─ MODULAR / removable (grep KIMI-ARM). ────────────────────────────────────────┐
# │ SOFT-KILL (stop it, zero risk): disable or delete THIS workflow — the market   │
# │ pipeline is untouched and the arm simply stops growing.                        │
# │ HARD-KILL: also delete .macro-assist/kimi_arm.py + tests/test_kimi_arm.py +    │
# │ the two kimi workflows + results/**/*-kimi-macro.md + results/scores/          │
# │ *__kimi.json. The arm-keying / calibration_by_arm hooks are generic (shared    │
# │ with the exogenous arm) — leave them.                                          │
# └────────────────────────────────────────────────────────────────────────────────┘
#
# Needs the MOONSHOT_API_KEY repo secret. Exits non-zero if the day's payload
# preview is missing (kimi_arm.py returns None → main() returns 1); a note that
# already exists for the date is a clean no-op unless `force` is set, which is
# what makes the pipeline's catch-up run safe to re-fire.

on:
  # WAS stage 4 of .github/workflows/pipeline.yml until 2026-09-04, which guaranteed
  # the market run had published the day's payload preview before this started.
  # The job is gone from pipeline.yml; this trigger is kept so restoring the arm is
  # putting that job back, and nothing else. Note a manual run still needs that
  # day's committed payload preview to exist.
  workflow_call:
    inputs:
      asof:
        description: "Date (YYYY-MM-DD; blank = today) — needs a committed payload preview"
        type: string
        default: ""
      n:
        description: "Ensemble samples"
        type: string
        default: "12"
      force:
        description: "Overwrite an existing note for that date"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      asof:
        description: "Date (YYYY-MM-DD; blank = today) — needs a committed payload preview"
        type: string
        default: ""
      n:
        description: "Ensemble samples"
        type: string
        default: "12"
      force:
        description: "Overwrite an existing note for that date"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  emit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Macro-Assist
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .macro-assist/requirements.txt

      - name: Install dependencies
        run: pip install -r .macro-assist/requirements.txt

      - name: Mount output branch at results/
        run: bash .macro-assist/ci_mount_output.sh

      - name: Emit Kimi ensemble note
        env:
          MOONSHOT_API_KEY: ${{ secrets.MOONSHOT_API_KEY }}
        run: |
          echo "::group::Kimi ensemble"
          python .macro-assist/kimi_arm.py \
            ${{ inputs.asof && format('--asof {0}', inputs.asof) || '' }} \
            --n "${{ inputs.n || '12' }}" \
            ${{ inputs.force && '--force' || '' }}
          echo "::endgroup::"

      - name: Publish Kimi note to output branch
        run: |
          bash .macro-assist/ci_publish_results.sh "kimi: $(date -u +%Y-%m-%d) ensemble arm note"
