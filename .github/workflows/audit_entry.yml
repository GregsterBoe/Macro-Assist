name: Entry audit (WP-25.C)

# The promotion-tier audit of one register entry (ADR-0022). CI runs it and CI
# records it: the proposer never runs a promotion-tier audit and relays the
# answer. Runs `audit_entry.py <hid> --ci`, which refuses before any API call
#   - off main, or on a shallow clone (the bundle needs the entry's history and
#     each report's commit list, so this job fetches both branches in full);
#   - with a model / effort / instructions / canary set that no passing canary
#     suite on the output branch certifies (auditor_canaries.yml, WP-25.A);
#   - on text CI has already audited — that would be a retry, not a
#     resubmission;
#   - after two rejections, unless the owner's decision is pinned (No grinding).
#
# A real run writes the record and the owner's brief to the output branch under
# results/audit/entries/<hid>/, then writes the entry's `Audit record` field on
# main from CI's records (`--sync-field`). record_audit.py holds that field to
# the records and holds a promotion to the latest one (approval-stamp).
#
# MANUAL ONLY. A real run costs API money — one audit, roughly $0.25–0.50 at
# the default claude-opus-5-5 / high (the record carries its estimate) — and
# counts as a submission: a rejection is one of
# the two an entry gets. `dry_run` is on by default — it runs every refusal
# check and builds the bundle, and spends nothing. Trigger: Actions tab -> this
# workflow -> Run, with the entry id.

on:
  workflow_dispatch:
    inputs:
      hid:
        description: "Register entry to audit, e.g. H-008"
        type: string
        required: true
      dry_run:
        description: "Check and bundle only; no API call, nothing recorded"
        type: boolean
        default: true
      model:
        description: "Auditor model (must be certified by a passing canary suite)"
        type: string
        default: "claude-opus-5-5"
      effort:
        description: "Auditor effort (must be certified by a passing canary suite)"
        type: string
        default: "high"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

# Never cancel a paid audit halfway; audits of one entry queue.
concurrency:
  group: audit-entry-${{ inputs.hid }}
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Checkout, with main's full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .macro-assist/requirements.txt

      - name: Install dependencies
        run: pip install -r .macro-assist/requirements.txt

      - name: Run the offline auditor tests first
        run: python -m pytest .macro-assist/tests/test_audit_entry.py -q

      - name: Mount output branch at results/, with its history
        env:
          OUTPUT_FULL_HISTORY: "1"
        run: bash .macro-assist/ci_mount_output.sh

      - name: Audit
        id: audit
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          HID: ${{ inputs.hid }}
          MODEL: ${{ inputs.model }}
          EFFORT: ${{ inputs.effort }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +e
          flags=()
          [ "$DRY_RUN" = "true" ] && flags+=(--dry-run)
          python .macro-assist/audit_entry.py "$HID" --ci --model "$MODEL" --effort "$EFFORT" \
            "${flags[@]}" > audit.md
          status=$?
          cat audit.md
          cat audit.md >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"
          # 0 = checked (dry run) or audited, whatever the verdict; 1 = the audit
          # did not complete, which is not a pass; 2 = refused before any spend.
          exit "$status"

      - name: Publish the record to the output branch
        if: ${{ !inputs.dry_run }}
        run: |
          bash .macro-assist/ci_publish_results.sh \
            "audit: ${{ inputs.hid }} $(date -u +%Y-%m-%dT%H%MZ) (${{ inputs.model }} / ${{ inputs.effort }})"

      - name: Write the entry's Audit record on main
        if: ${{ !inputs.dry_run }}
        env:
          HID: ${{ inputs.hid }}
        run: |
          # The field is rendered from the records just published, so it is
          # rewritten on top of whatever main holds now, not rebased onto it.
          for attempt in 1 2 3 4 5; do
            git fetch -q origin +refs/heads/main:refs/remotes/origin/main \
                                +refs/heads/output:refs/remotes/origin/output \
              && git reset -q --hard origin/main || { sleep 3; continue; }
            python .macro-assist/audit_entry.py "$HID" --sync-field
            git add docs/record/hypotheses.md
            if git diff --cached --quiet; then
              echo "The Audit record is already current."
              exit 0
            fi
            git commit -q -m "audit: $HID — Audit record from CI's records"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push to main failed (attempt $attempt/5) — retrying." >&2
            sleep $(( attempt * 3 ))
          done
          echo "error: the record is on output but the Audit record did not reach main;" \
               "record_audit.py will say so until 'audit_entry.py $HID --sync-field' is committed." >&2
          exit 1
