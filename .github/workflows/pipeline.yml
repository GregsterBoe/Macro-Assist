name: Macro Pipeline

# Single entry point for the daily (and, on Mondays, weekly) pipeline.
#
# WHY THIS EXISTS
# The stages used to be six independent workflows chained by wall-clock cron
# offsets (06:00 → 06:30 → 06:45 → 07:05 → 07:15 → 07:45). Each one drew its own
# scheduling delay from GitHub, and those delays are far larger than the gaps:
# measured 42–224 min through July/August 2026, peaking at 372 min on 2026-06-15.
# The ordering only ever held by luck. On 2026-08-03 it didn't — Weekly Scoring
# started 34s after the Kimi arm and both ran against the same commit, so that
# day's kimi note went unscored with every check green. On 2026-08-27 GitHub
# dropped the day's schedules entirely and nothing ran at all.
#
# Ordering is now a `needs:` graph, so it cannot drift. The delay itself is
# GitHub's and can't be fixed from here — the catch-up cron below absorbs it.
#
# THE RUN'S DATE
# The delay got far worse: 2026-08-28's two slots were delivered 12h25m and
# 10h28m late, both in the evening. Since stages used to read the clock
# themselves, a run crossing UTC midnight would have written the next day's note
# and skipped the Monday-only stages — silently, all green. `plan` now resolves
# the date once and every stage takes it as `asof`. Nothing downstream may call
# `date` or `date.today()` for the run's own date.
#
# RE-RUNNING A FAILED STAGE
# Each stage is a job, and the job is GitHub's unit of re-run: "Re-run failed
# jobs" on the run page re-runs only the failed stage plus the stages downstream
# of it. Stages that already succeeded are skipped, not repeated. There is no
# need to re-run the whole pipeline to recover one bad stage.
#
# Every stage remains individually dispatchable from the Actions tab with its
# own full input set — converting them to reusable workflows did not take that
# away.

on:
  schedule:
    # Primary. Odd minute on purpose: :00/:15/:30/:45 are the most contended
    # slots on GitHub's scheduler and draw the worst delays.
    - cron: "23 6 * * 1-5"
    # Catch-up. GitHub drops scheduled events under load rather than queueing
    # them, so a missed morning otherwise means a silent gap in the series.
    # Stages no-op when their output for the date already exists (force=false),
    # so on a normal day this run costs ~1 min per stage and writes nothing.
    - cron: "47 10 * * 1-5"
  workflow_dispatch:
    inputs:
      asof:
        description: "Date the whole run is for (YYYY-MM-DD; blank = auto, see `plan`)"
        type: string
        default: ""
      force:
        description: "Overwrite existing notes for that date (all stages)"
        type: boolean
        default: false
      kimi_n:
        description: "Kimi ensemble samples"
        type: string
        default: "12"
      pf_reset:
        description: "Portfolio: rewrite this week from a clean slate"
        type: boolean
        default: false
      weekly:
        description: "Run the Monday-only stages (exo / scoring / rebalance)"
        type: choice
        options: [auto, "yes", "no"]
        default: auto

permissions:
  contents: write

# Keep the catch-up run from overlapping the primary. Queue rather than cancel:
# a stage that is mid-push to the output branch must not be killed.
concurrency:
  group: macro-pipeline
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      weekly: ${{ steps.decide.outputs.weekly }}
      asof: ${{ steps.decide.outputs.asof }}
    steps:
      - name: Decide the date and which stages run
        id: decide
        run: |
          set -euo pipefail

          # THE DATE IS RESOLVED ONCE, HERE, AND PASSED TO EVERY STAGE.
          # Stages must never re-read the clock: GitHub delivers scheduled runs
          # late (12h25m on 2026-08-28, against a 372 min prior worst case), and a
          # run that crosses UTC midnight would otherwise have each stage compute a
          # different day than the one the run is for — writing tomorrow's note and
          # leaving the intended day permanently empty, with every check green.
          #
          # The earliest cron is 06:23 UTC, so a run landing before 06:00 cannot be
          # its own day's slot: it is the previous day's, delivered late. Dispatch
          # with `asof` to override.
          ASOF="${{ inputs.asof }}"
          if [ -z "$ASOF" ]; then
            if [ "$(date -u +%H)" -lt 06 ]; then
              ASOF="$(date -u -d 'yesterday' +%Y-%m-%d)"
              ASOF_WHY="auto: ran at $(date -u +%H:%M) UTC, before the 06:23 cron — previous day's slot"
            else
              ASOF="$(date -u +%Y-%m-%d)"
              ASOF_WHY="auto: today (UTC)"
            fi
          else
            ASOF_WHY="pinned via dispatch"
          fi

          # `inputs` is empty on a schedule trigger, so this falls through to auto.
          case "${{ inputs.weekly }}" in
            yes) WEEKLY=true  ; REASON="forced on via dispatch" ;;
            no)  WEEKLY=false ; REASON="forced off via dispatch" ;;
            *)   if [ "$(date -u -d "$ASOF" +%u)" = "1" ]; then
                   WEEKLY=true ; REASON="auto: $ASOF is a Monday"
                 else
                   WEEKLY=false; REASON="auto: $ASOF is a $(date -u -d "$ASOF" +%A)"
                 fi ;;
          esac
          echo "weekly=$WEEKLY" >> "$GITHUB_OUTPUT"
          echo "asof=$ASOF"     >> "$GITHUB_OUTPUT"
          {
            echo "### Pipeline plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| as-of date | \`$ASOF\` — $ASOF_WHY |"
            echo "| started (UTC) | \`$(date -u +%Y-%m-%d\ %H:%M)\` |"
            echo "| trigger | \`${{ github.event_name }}\` |"
            echo "| weekly stages | \`$WEEKLY\` — $REASON |"
            echo ""
            echo "Daily: data_check → daily → kimi"
            if [ "$WEEKLY" = "true" ]; then
              echo "Weekly: + exo (before kimi), scoring, rebalance"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  data_check:
    name: 1 · data check
    needs: plan
    uses: ./.github/workflows/macro_data_check.yml
    secrets: inherit

  daily:
    name: 2 · daily note
    needs: [plan, data_check]
    uses: ./.github/workflows/macro_daily.yml
    with:
      asof: ${{ needs.plan.outputs.asof }}
      force: ${{ inputs.force || false }}
    secrets: inherit

  exo:
    name: 3 · exogenous arm
    needs: [plan, daily]
    if: ${{ needs.plan.outputs.weekly == 'true' }}
    uses: ./.github/workflows/exo_weekly_emit.yml
    with:
      asof: ${{ needs.plan.outputs.asof }}
      force: ${{ inputs.force || false }}
    secrets: inherit

  kimi:
    name: 4 · kimi arm
    needs: [plan, daily, exo]
    # `exo` is skipped Tue–Fri, and a skipped dependency would otherwise skip
    # this job too. Gate on daily's result explicitly and tolerate exo's skip.
    if: >-
      ${{ !cancelled()
          && needs.daily.result == 'success'
          && (needs.exo.result == 'success' || needs.exo.result == 'skipped') }}
    uses: ./.github/workflows/kimi_arm_daily.yml
    with:
      asof: ${{ needs.plan.outputs.asof }}
      n: ${{ inputs.kimi_n || '12' }}
      force: ${{ inputs.force || false }}
    secrets: inherit

  scoring:
    name: 5 · weekly scoring
    needs: [plan, kimi]
    if: >-
      ${{ !cancelled()
          && needs.plan.outputs.weekly == 'true'
          && needs.kimi.result == 'success' }}
    uses: ./.github/workflows/macro_weekly_scoring.yml
    secrets: inherit

  rebalance:
    name: 6 · portfolio rebalance
    needs: [plan, scoring]
    if: >-
      ${{ !cancelled()
          && needs.plan.outputs.weekly == 'true'
          && needs.scoring.result == 'success' }}
    uses: ./.github/workflows/portfolio_rebalance.yml
    with:
      date: ${{ needs.plan.outputs.asof }}
      reset: ${{ inputs.pf_reset || false }}
    secrets: inherit
