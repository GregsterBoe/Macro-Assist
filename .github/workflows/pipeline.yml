name: Macro Pipeline

# Single entry point for the daily (and, on Mondays, weekly) pipeline.
#
# WHAT TRIGGERS THIS
# An external cron service, over the API. There is no `schedule:` block below,
# on purpose. The reference caller is `trigger_pipeline.sh` in the repo root;
# the schedule table, the token and the raw request are in README → "External
# cron trigger". The call is:
#
#   POST /repos/<owner>/<repo>/actions/workflows/pipeline.yml/dispatches
#   {"ref": "main", "inputs": {"source": "cron-primary"}}
#
# GitHub's own `schedule:` was the trigger until 2026-08-31 and was dropped for
# being unreliable in a way nothing in this file could compensate for: runs
# delivered 42–224 min late through July/August 2026 (peak 372 min on
# 2026-06-15), then 12h25m and 10h28m on 2026-08-28, and on 2026-08-27 the day's
# schedules were dropped entirely and nothing ran at all. An external call is
# delivered when it is made, and a failed call is visible in the caller's own log
# instead of being silently absent here.
#
# Every guard below still assumes a call can arrive late or twice: the trigger
# changed, the invariants did not.
#
# WHY ONE RUN, NOT SIX
# The stages used to be six independent workflows chained by wall-clock cron
# offsets (06:00 → 06:30 → 06:45 → 07:05 → 07:15 → 07:45). Each one drew its
# own scheduling delay, and those delays were far larger than the gaps, so the
# ordering only ever held by luck. On 2026-08-03 it didn't — Weekly Scoring
# started 34s after the Kimi arm and both ran against the same commit, so that
# day's kimi note went unscored with every check green. Ordering is now a
# `needs:` graph, so it cannot drift.
#
# THE RUN'S DATE
# Stages used to read the clock themselves, so a run crossing UTC midnight would
# have written the next day's note and skipped the Monday-only stages — silently,
# all green. That is a live risk for any late call, not just a GitHub-scheduler
# one. `plan` resolves the date once and every stage takes it as `asof`. Nothing
# downstream may call `date` or `date.today()` for the run's own date.
#
# THE CATCH-UP CALL
# The external service calls this workflow a second time each weekday (see the
# README table). Stages no-op when their output for the date already exists
# (force=false), so on a normal day the catch-up costs ~1 min per stage and
# writes nothing; on a day the primary call never landed — service outage,
# expired token, GitHub 5xx — it fills the gap unattended. Two calls a day is
# also why `concurrency` below queues rather than cancels.
#
# RE-RUNNING A FAILED STAGE
# Each stage is a job, and the job is GitHub's unit of re-run: "Re-run failed
# jobs" on the run page re-runs only the failed stage plus the stages downstream
# of it. Stages that already succeeded are skipped, not repeated. There is no
# need to re-run the whole pipeline to recover one bad stage.
#
# Every stage remains individually dispatchable from the Actions tab with its
# own full input set — converting them to reusable workflows did not take that
# away.

# Every run is now a dispatch, so the run list would otherwise be an
# undifferentiated column of "Macro Pipeline". Name it by who asked and for when.
run-name: "Macro Pipeline · ${{ inputs.source }}${{ inputs.asof && format(' · {0}', inputs.asof) || '' }}"

on:
  workflow_dispatch:
    inputs:
      asof:
        description: "Date the whole run is for (YYYY-MM-DD; blank = auto, see `plan`)"
        type: string
        default: ""
      force:
        description: "Overwrite existing notes for that date (all stages)"
        type: boolean
        default: false
      kimi_n:
        description: "Kimi ensemble samples"
        type: string
        default: "12"
      pf_reset:
        description: "Portfolio: rewrite this week from a clean slate"
        type: boolean
        default: false
      weekly:
        description: "Run the Monday-only stages (exo / scoring / rebalance)"
        type: choice
        options: [auto, "yes", "no"]
        default: auto
      source:
        description: "Who asked for this run (labels the run; no effect on what runs)"
        type: string
        default: "manual"

permissions:
  contents: write

# Keep the catch-up run from overlapping the primary. Queue rather than cancel:
# a stage that is mid-push to the output branch must not be killed.
concurrency:
  group: macro-pipeline
  cancel-in-progress: false

jobs:
  plan:
    name: plan
    runs-on: ubuntu-latest
    outputs:
      weekly: ${{ steps.decide.outputs.weekly }}
      asof: ${{ steps.decide.outputs.asof }}
    steps:
      - name: Decide the date and which stages run
        id: decide
        run: |
          set -euo pipefail

          # THE DATE IS RESOLVED ONCE, HERE, AND PASSED TO EVERY STAGE.
          # Stages must never re-read the clock. A run that crosses UTC midnight
          # would otherwise have each stage compute a different day than the one
          # the run is for — writing tomorrow's note and leaving the intended day
          # permanently empty, with every check green. The external caller is
          # prompt where GitHub's scheduler was not (12h25m late on 2026-08-28),
          # but a retry after an outage still lands late, so the guard stays.
          #
          # The earliest scheduled call is 06:23 UTC (README → External cron
          # trigger), so a run landing before 06:00 cannot be its own day's slot:
          # it is the previous day's, delivered late. Pass `asof` to override —
          # the external caller can pin it explicitly if its service can compute
          # a date.
          ASOF="${{ inputs.asof }}"
          if [ -z "$ASOF" ]; then
            if [ "$(date -u +%H)" -lt 06 ]; then
              ASOF="$(date -u -d 'yesterday' +%Y-%m-%d)"
              ASOF_WHY="auto: ran at $(date -u +%H:%M) UTC, before the 06:23 call — previous day's slot"
            else
              ASOF="$(date -u +%Y-%m-%d)"
              ASOF_WHY="auto: today (UTC)"
            fi
          else
            ASOF_WHY="pinned via dispatch"
          fi

          # The cron caller sends no `weekly`, so it takes the `auto` default and
          # falls through to the weekday check below.
          case "${{ inputs.weekly }}" in
            yes) WEEKLY=true  ; REASON="forced on via dispatch" ;;
            no)  WEEKLY=false ; REASON="forced off via dispatch" ;;
            *)   if [ "$(date -u -d "$ASOF" +%u)" = "1" ]; then
                   WEEKLY=true ; REASON="auto: $ASOF is a Monday"
                 else
                   WEEKLY=false; REASON="auto: $ASOF is a $(date -u -d "$ASOF" +%A)"
                 fi ;;
          esac
          echo "weekly=$WEEKLY" >> "$GITHUB_OUTPUT"
          echo "asof=$ASOF"     >> "$GITHUB_OUTPUT"
          {
            echo "### Pipeline plan"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| as-of date | \`$ASOF\` — $ASOF_WHY |"
            echo "| started (UTC) | \`$(date -u +%Y-%m-%d\ %H:%M)\` |"
            echo "| trigger | \`${{ github.event_name }}\` (source: \`${{ inputs.source }}\`) |"
            echo "| weekly stages | \`$WEEKLY\` — $REASON |"
            echo ""
            echo "Daily: data_check → daily → kimi"
            if [ "$WEEKLY" = "true" ]; then
              echo "Weekly: + exo (before kimi), scoring, rebalance"
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  data_check:
    name: 1 · data check
    needs: plan
    uses: ./.github/workflows/macro_data_check.yml
    secrets: inherit

  daily:
    name: 2 · daily note
    needs: [plan, data_check]
    uses: ./.github/workflows/macro_daily.yml
    with:
      asof: ${{ needs.plan.outputs.asof }}
      force: ${{ inputs.force || false }}
    secrets: inherit

  exo:
    name: 3 · exogenous arm
    needs: [plan, daily]
    if: ${{ needs.plan.outputs.weekly == 'true' }}
    uses: ./.github/workflows/exo_weekly_emit.yml
    with:
      asof: ${{ needs.plan.outputs.asof }}
      force: ${{ inputs.force || false }}
    secrets: inherit

  kimi:
    name: 4 · kimi arm
    needs: [plan, daily, exo]
    # `exo` is skipped Tue–Fri, and a skipped dependency would otherwise skip
    # this job too. Gate on daily's result explicitly and tolerate exo's skip.
    if: >-
      ${{ !cancelled()
          && needs.daily.result == 'success'
          && (needs.exo.result == 'success' || needs.exo.result == 'skipped') }}
    uses: ./.github/workflows/kimi_arm_daily.yml
    with:
      asof: ${{ needs.plan.outputs.asof }}
      n: ${{ inputs.kimi_n || '12' }}
      force: ${{ inputs.force || false }}
    secrets: inherit

  scoring:
    name: 5 · weekly scoring
    needs: [plan, kimi]
    if: >-
      ${{ !cancelled()
          && needs.plan.outputs.weekly == 'true'
          && needs.kimi.result == 'success' }}
    uses: ./.github/workflows/macro_weekly_scoring.yml
    secrets: inherit

  rebalance:
    name: 6 · portfolio rebalance
    needs: [plan, scoring]
    if: >-
      ${{ !cancelled()
          && needs.plan.outputs.weekly == 'true'
          && needs.scoring.result == 'success' }}
    uses: ./.github/workflows/portfolio_rebalance.yml
    with:
      date: ${{ needs.plan.outputs.asof }}
      reset: ${{ inputs.pf_reset || false }}
    secrets: inherit
