name: Weekly Model Refit

# STAGE 5 OF `pipeline.yml`, on Mondays. It is also still dispatchable on its own.
#
# History worth keeping, because the failure was instructive. This used to be its
# own externally-cron'd call at `0 22 * * 0` — Sunday night, so Monday's pipeline
# picked up fresh models — with no `schedule:` of its own and deliberately not a
# pipeline stage, on the reasoning that it has no upstream dependency. Then the
# cron infrastructure was rebuilt to call only `pipeline.yml`, and that reasoning
# turned out to be exactly what made this orphanable: it was the one scheduled
# thing not reachable from the one trigger that still fires. The conditional
# table froze at 2026-08-31, nothing failed, no check went red, and the six-asset
# universe WP-22.A had already shipped could never land. "No upstream dependency"
# is an argument for being independently *runnable*, not for being independently
# *triggered* — ADR-0013's point.
#
# So it is now a stage, and it runs LAST in the pipeline on purpose: it commits
# model artifacts to `main`, while every stage checks out `github.sha`, the
# commit that triggered the run. A stage ordered after it would still see the
# pre-refit tree. See the comment on the `refit` job in `pipeline.yml` before
# reordering anything.
#
# A missed refit is still not silent-but-fatal the way a missed daily note is:
# the models stay a week old and the next Monday refreshes them. There is
# deliberately no catch-up call.

run-name: "Weekly Model Refit · ${{ inputs.source }}"

on:
  # Called as a stage of `pipeline.yml`; still dispatchable standalone, which is
  # how a one-off refresh is done between Mondays.
  workflow_call:
    inputs:
      source:
        description: "Who asked for this run (labels the run; no effect on what runs)"
        type: string
        default: "pipeline"
  workflow_dispatch:
    inputs:
      source:
        description: "Who asked for this run (labels the run; no effect on what runs)"
        type: string
        default: "manual"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Macro-Assist
        uses: actions/checkout@v4
        with:
          path: macro-assist
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: macro-assist/.macro-assist/requirements.txt

      - name: Install dependencies
        run: pip install -r macro-assist/.macro-assist/requirements.txt

      - name: Run model refit
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -e
          cd macro-assist
          python .macro-assist/refit_models.py

      - name: Commit model artifacts
        run: |
          set -e
          cd macro-assist
          git config user.name  "macro-assist[bot]"
          git config user.email "macro-assist[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
          git add .macro-assist/data/regime_model.pkl .macro-assist/data/conditional_distributions.json
          git diff --cached --quiet || git commit -m "refit: $(date -u +%Y-%m-%d) weekly model update"
          git push origin HEAD
