name: Weekly Model Refit

# TRIGGERED FROM OUTSIDE GITHUB, like `pipeline.yml`: Sundays at 22:00 UTC, so
# Monday's pipeline picks up fresh models. It has no upstream dependency, which
# is why it is its own call and not a stage of the pipeline. There is no
# `schedule:` here on purpose — see README → "External cron trigger" for the
# schedule table and the request; `trigger_pipeline.sh` is the reference caller:
#
#   ./trigger_pipeline.sh --workflow macro_weekly_refit.yml --source cron-refit
#
# A missed refit is not silent-but-fatal the way a missed daily note is: the
# models simply stay a week old and the next Sunday call refreshes them. There
# is deliberately no catch-up call for it.

run-name: "Weekly Model Refit · ${{ inputs.source }}"

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Who asked for this run (labels the run; no effect on what runs)"
        type: string
        default: "manual"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  refit:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Macro-Assist
        uses: actions/checkout@v4
        with:
          path: macro-assist
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: macro-assist/.macro-assist/requirements.txt

      - name: Install dependencies
        run: pip install -r macro-assist/.macro-assist/requirements.txt

      - name: Run model refit
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          set -e
          cd macro-assist
          python .macro-assist/refit_models.py

      - name: Commit model artifacts
        run: |
          set -e
          cd macro-assist
          git config user.name  "macro-assist[bot]"
          git config user.email "macro-assist[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
          git add .macro-assist/data/regime_model.pkl .macro-assist/data/conditional_distributions.json
          git diff --cached --quiet || git commit -m "refit: $(date -u +%Y-%m-%d) weekly model update"
          git push origin HEAD
