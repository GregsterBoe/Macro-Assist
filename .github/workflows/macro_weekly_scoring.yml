name: Weekly Prediction Scoring

on:
  schedule:
    # Mondays at 07:15 UTC — runs after the daily note (06:30) is done
    - cron: "15 7 * * 1"
  workflow_dispatch:   # manual trigger for testing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  score-and-summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Macro-Assist
        uses: actions/checkout@v4
        with:
          path: macro-assist

      - name: Checkout External-Brain (vault — source of reports)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.VAULT_REPO }}
          token: ${{ secrets.VAULT_PAT }}
          path: vault

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: macro-assist/.macro-assist/requirements.txt

      - name: Install dependencies
        run: pip install -r macro-assist/.macro-assist/requirements.txt

      - name: Score predictions
        env:
          # Point scorer at the vault so it finds Economy/YYYY/MM/reports
          MACRO_REPORTS_DIR: ${{ github.workspace }}/vault
        run: python macro-assist/.macro-assist/score_predictions.py

      - name: Summarize accuracy
        run: python macro-assist/.macro-assist/summarize_accuracy.py

      - name: Commit accuracy summary to Macro-Assist
        run: |
          cd macro-assist
          git config user.name  "macro-assist[bot]"
          git config user.email "macro-assist[bot]@users.noreply.github.com"
          git add .macro-assist/data/ results/accuracy_report.md results/scores/
          git diff --cached --quiet || git commit -m "accuracy: $(date -u +%Y-%m-%d) weekly scoring update"
          git push origin HEAD

      - name: Copy and push accuracy report to vault
        run: |
          cd vault
          mkdir -p Economy/Analysis
          cp ${{ github.workspace }}/macro-assist/results/accuracy_report.md Economy/Analysis/prediction-accuracy.md
          git config user.name  "macro-assist[bot]"
          git config user.email "macro-assist[bot]@users.noreply.github.com"
          git add Economy/Analysis/prediction-accuracy.md
          git diff --cached --quiet || git commit -m "accuracy: $(date -u +%Y-%m-%d) prediction accuracy report"
          git push origin HEAD
