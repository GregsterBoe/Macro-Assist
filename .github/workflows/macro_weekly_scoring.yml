name: Weekly Prediction Scoring

on:
  # Scheduled as stage 3 of .github/workflows/pipeline.yml (Mondays only).
  # Was stage 5 and gated on the kimi arm; re-parented onto `daily` in WP-21.F so
  # standing the arms down could not silently stop the scorer.
  #
  # The directional scorer (score_predictions.py) is retired from this stage
  # (WP-22.D): its record is finite — the last note carrying a call is
  # 2026-09-04 — and the 2026-10-05 run printed DIRECTIONAL RECORD CLOSED. Its
  # scored history stays on `output` under scores/ and summarize_accuracy.py
  # still reads it. Soft-kill (ADR-0015): the module and its tests stay;
  # restoring it is re-adding its step above `Score conditional distributions`.
  workflow_call:
  workflow_dispatch:   # manual trigger for testing

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  score-and-summarize:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Macro-Assist
        uses: actions/checkout@v4
        with:
          path: macro-assist
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: macro-assist/.macro-assist/requirements.txt

      - name: Install dependencies
        run: pip install -r macro-assist/.macro-assist/requirements.txt

      - name: Mount output branch at results/
        run: |
          set -e
          cd macro-assist
          bash .macro-assist/ci_mount_output.sh

      # The v1.6 successor to score_predictions.py: this scores what the note
      # actually publishes now (Phase 22).
      - name: Score conditional distributions
        run: |
          set -e
          python macro-assist/.macro-assist/score_distributions.py

      - name: Summarize accuracy
        run: |
          set -e
          python macro-assist/.macro-assist/summarize_accuracy.py

      - name: Commit model data to Macro-Assist (main)
        run: |
          set -e
          cd macro-assist
          git config user.name  "macro-assist[bot]"
          git config user.email "macro-assist[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin "$(git rev-parse --abbrev-ref HEAD)"
          git add .macro-assist/data/
          git diff --cached --quiet || git commit -m "accuracy: $(date -u +%Y-%m-%d) weekly scoring data update"
          git push origin HEAD

      - name: Publish scores to output branch
        run: |
          set -e
          cd macro-assist
          bash .macro-assist/ci_publish_results.sh "accuracy: $(date -u +%Y-%m-%d) weekly scoring update"

