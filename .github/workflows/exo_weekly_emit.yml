name: Exogenous Weekly Emission (Phase 19)

# ╔═══════════════════════════════════════════════════════════════════════════════╗
# ║ DEACTIVATED 2026-09-04 (WP-21.D). Removed from pipeline.yml as stage 3, so it  ║
# ║ no longer runs weekly. `workflow_dispatch` below still works by hand.          ║
# ║                                                                               ║
# ║ WHY: the pre-committed gate (DESIGN §4, §5) is a scored directional lean       ║
# ║ A/B'd head-to-head against the market-only arm. v1.6 cut the market arm's      ║
# ║ directional calls [KB-024], so the comparator stopped accumulating and the     ║
# ║ gate became unreadable — the arm would have been measured against a frozen     ║
# ║ record it can neither beat nor lose to.                                        ║
# ║                                                                               ║
# ║ NOTE this is a pause on the *scoring contract*, not a verdict on the           ║
# ║ mechanism. The expectations-gap thesis (SPF economist consensus vs the Fed's   ║
# ║ own SEP dots, tracked against evolving FOMC communication) was never tested —  ║
# ║ it never reached n. Two ways back, both live options:                          ║
# ║   (a) re-point the gate at the WP-21.A benchmark — always_bullish / neutral    ║
# ║       on the same dates, which [KB-024] shows is a genuinely hard bar; or      ║
# ║   (b) re-cut the output the way the main note was re-cut. DESIGN §1 says the   ║
# ║       branch is about expectations-gaps and regime, NOT direction — the        ║
# ║       directional lean was chosen as a scoring convenience, and it is the      ║
# ║       part that just became unscoreable.                                       ║
# ║                                                                               ║
# ║ SOFT-KILL per DESIGN §9: nothing deleted. exogenous/, its tests, the emitted   ║
# ║ notes and the scored history all stay. Restore the stage to resume.            ║
# ╚═══════════════════════════════════════════════════════════════════════════════╝

# Live/forward emission of the monetary exogenous arm (DESIGN §4/§6.2): fetch the
# latest FOMC statement, run L0->L3, and write an `arm: exogenous` note into
# results/ where score_predictions scans.
#
# ┌─ STATUS: INTEGRATED into main, but MODULAR / removable (DESIGN §9 kill list). ─┐
# │ Runs weekly and auto-commits the exogenous arm's note. It is isolated: it only │
# │ writes `*-exogenous-macro.md`, never touches the market pipeline, and can be   │
# │ excised cleanly (delete exogenous/ + this workflow + the emitted notes/scores; │
# │ the shared hooks are inert without exogenous data). SOFT-KILL = disable/delete │
# │ this one workflow and the arm simply stops growing.                            │
# └────────────────────────────────────────────────────────────────────────────────┘
#
# Validation is forward-only: this accumulates arm-tagged leans over time. Between
# FOMC meetings the statement is unchanged, so weekly leans are correlated — an
# honest limit of a monthly-cadence signal (each week is still a fresh forward call).

on:
  # WAS stage 3 of .github/workflows/pipeline.yml (Mondays only) until 2026-09-04.
  # The job is gone from pipeline.yml; this trigger is kept so restoring the arm is
  # putting that job back, and nothing else.
  workflow_call:
    inputs:
      asof:
        description: "Prediction date (YYYY-MM-DD; blank = today)"
        type: string
        default: ""
      force:
        description: "Overwrite an existing note for that date"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      asof:
        description: "Prediction date (YYYY-MM-DD; blank = today)"
        type: string
        default: ""
      force:
        description: "Overwrite an existing note for that date"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  emit:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Macro-Assist
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .macro-assist/requirements.txt

      - name: Install dependencies
        run: pip install -r .macro-assist/requirements.txt

      - name: Mount output branch at results/
        run: bash .macro-assist/ci_mount_output.sh

      - name: Emit exogenous note
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
        run: |
          echo "::group::Exogenous emission"
          python .macro-assist/exogenous/emit.py \
            ${{ inputs.asof && format('--asof {0}', inputs.asof) || '' }} \
            ${{ inputs.force && '--force' || '' }}
          echo "::endgroup::"

      - name: Publish exogenous note to output branch
        run: |
          bash .macro-assist/ci_publish_results.sh "exo: $(date -u +%Y-%m-%d) exogenous arm note"
