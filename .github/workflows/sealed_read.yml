name: Sealed read — the seal key (WP-25.D)

# A sealed read is the one irreversible act in the research loop: the held-out
# slice is read once, and a number seen there cannot be unseen. ADR-0022 leaves
# it with the owner, as an action only the owner's account can take — this
# workflow's second job names the `seal-key` environment, whose only required
# reviewer is the owner, so GitHub holds the job until the owner approves it
# in the Actions tab (the run page shows "Review deployments").
#
#   preflight   may this entry be read at all? `promoted`, a CI audit stamped
#               to its current text found nothing blocking, no sealed read yet
#               — and is the key itself sound (the environment exists, the
#               owner is its only reviewer, nobody can bypass it). Nobody is
#               asked to turn a key for a run that would be refused.
#   key         waits for the owner. When it starts, it reads the run's
#               approval record and checks the owner, and nobody else, turned
#               the key: GitHub creates an unprotected environment the first
#               time a job names one, so a running job proves nothing on its
#               own. Then the preflight again, against output as it is now.
#
#   then, on a real run only, the sealed runner (sealed_runner.py, WP-23.B):
#   fetch       the public inputs; nothing scored, so a failure spends nothing
#   claim       the class's slice, pushed to output BEFORE anything is scored.
#               The read is irreversible: a run that dies after this line has
#               spent the slice and says so (a lost read), never the reverse
#   read        the entry's arm, the benchmark and the rival walked on the
#               sealed side, the class bar applied; result and report pushed
#   ledger      the entry's `Sealed read (ledger)` written on main from CI's
#               records — also after a failed read, so a lost read shows
#
# A dry run (the default) reads nothing: it skips all four and reports what
# the entry would be refused for, so the pause can be shown on an entry that
# is not yet eligible; it still fails on an unsound key, because testing the
# key is what it is for. One sealed read at a time, repo-wide: the slice is
# spent per class, and two runs must not both find it unspent.
#
# MANUAL ONLY, and free: no API call. Trigger: Actions tab -> this workflow ->
# Run; then, on the run page, Review deployments -> seal-key -> Approve.

on:
  workflow_dispatch:
    inputs:
      hid:
        description: "Register entry (H-###)"
        type: string
        required: true
      dry_run:
        description: "Dry run: wait for the key, then read nothing"
        type: boolean
        default: true

concurrency:
  group: sealed-read
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout, with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .macro-assist/requirements.txt

      - name: Install dependencies
        run: pip install -r .macro-assist/requirements.txt

      - name: Run the offline key tests first
        run: python -m pytest .macro-assist/tests/test_seal_key.py .macro-assist/tests/test_class_bars.py .macro-assist/tests/test_sealed_runner.py -q

      - name: Mount output branch at results/, with history
        env:
          OUTPUT_FULL_HISTORY: "1"
        run: bash .macro-assist/ci_mount_output.sh

      - name: Read the key's settings
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A missing environment is a refusal, not a crash: write null.
          gh api "repos/$GITHUB_REPOSITORY/environments/seal-key" \
            > "$RUNNER_TEMP/environment.json" 2>/dev/null \
            || echo null > "$RUNNER_TEMP/environment.json"

      - name: Preflight
        env:
          HID: ${{ inputs.hid }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +e
          DRY=""
          if [ "$DRY_RUN" != "false" ]; then DRY="--dry-run"; fi
          python .macro-assist/seal_key.py "$HID" --preflight \
            --environment "$RUNNER_TEMP/environment.json" $DRY > preflight.md
          status=$?
          cat preflight.md
          cat preflight.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

  key:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    # GitHub holds this job here until a required reviewer of `seal-key`
    # approves it. Do not move this line, or add a step above it that reads
    # data: test_seal_key.py holds the job to this shape.
    environment: seal-key
    permissions:
      contents: write     # the claim and the result to output, the ledger to main
      actions: read
    steps:
      - name: Checkout, with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: .macro-assist/requirements.txt

      - name: Install dependencies
        run: pip install -r .macro-assist/requirements.txt

      - name: Mount output branch at results/, with history
        env:
          OUTPUT_FULL_HISTORY: "1"
        run: bash .macro-assist/ci_mount_output.sh

      - name: Who turned the key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/approvals" \
            > "$RUNNER_TEMP/approvals.json"

      - name: Check the key, then the entry again
        env:
          HID: ${{ inputs.hid }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set +e
          DRY=""
          if [ "$DRY_RUN" != "false" ]; then DRY="--dry-run"; fi
          python .macro-assist/seal_key.py "$HID" --after-key \
            --approvals "$RUNNER_TEMP/approvals.json" $DRY > key.md
          status=$?
          cat key.md
          cat key.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Fetch the inputs (nothing scored)
        if: ${{ !inputs.dry_run }}
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          HID: ${{ inputs.hid }}
        run: |
          python .macro-assist/sealed_runner.py "$HID" --fetch \
            --inputs "$RUNNER_TEMP/inputs.pkl" --approvals "$RUNNER_TEMP/approvals.json"

      - name: Claim the slice, before anything is scored
        id: claim
        if: ${{ !inputs.dry_run }}
        env:
          HID: ${{ inputs.hid }}
        run: |
          python .macro-assist/sealed_runner.py "$HID" --claim --approvals "$RUNNER_TEMP/approvals.json"
          bash .macro-assist/ci_publish_results.sh "sealed read: $HID claims its class's slice (run $GITHUB_RUN_ID)"

      - name: The sealed read
        if: ${{ !inputs.dry_run }}
        env:
          HID: ${{ inputs.hid }}
        run: |
          git fetch -q origin +refs/heads/output:refs/remotes/origin/output
          set +e
          python .macro-assist/sealed_runner.py "$HID" --read \
            --inputs "$RUNNER_TEMP/inputs.pkl" --approvals "$RUNNER_TEMP/approvals.json" > read.md
          status=$?
          cat read.md
          cat read.md >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Publish the result
        if: ${{ !inputs.dry_run }}
        env:
          HID: ${{ inputs.hid }}
        run: |
          bash .macro-assist/ci_publish_results.sh "sealed read: $HID result (run $GITHUB_RUN_ID)"

      - name: Write the entry's Sealed read (ledger) on main
        # after a failed read too: a claim with no result is a lost read, and it shows
        if: ${{ !cancelled() && !inputs.dry_run && steps.claim.outcome == 'success' }}
        env:
          HID: ${{ inputs.hid }}
        run: |
          for attempt in 1 2 3 4 5; do
            git fetch -q origin +refs/heads/main:refs/remotes/origin/main \
                                +refs/heads/output:refs/remotes/origin/output \
              && git reset -q --hard origin/main || { sleep 3; continue; }
            python .macro-assist/sealed_runner.py "$HID" --sync-field
            git add docs/record/hypotheses.md
            if git diff --cached --quiet; then
              echo "The Sealed read (ledger) is already current."
              exit 0
            fi
            git commit -q -m "sealed read: $HID — Sealed read (ledger) from CI's records"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "push to main failed (attempt $attempt/5) — retrying." >&2
            sleep $(( attempt * 3 ))
          done
          echo "error: the records are on output but the ledger did not reach main;" \
               "record_audit.py will say so until 'sealed_runner.py $HID --sync-field' is committed." >&2
          exit 1
