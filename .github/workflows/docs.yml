name: Docs

# Builds the MkDocs site from docs/ and publishes it to GitHub Pages.
#
# The markdown in docs/ is the single source of truth; this workflow only
# renders it. Nothing here authors content, so the site cannot drift from the
# repo the way a hand-maintained second copy would.
#
# Setup: the build job calls actions/configure-pages with enablement, which
# turns Pages on and sets its source to "GitHub Actions" via the API on the
# first run. If that call is blocked (org policy on workflow token scopes),
# do it by hand once: repo Settings -> Pages -> Source: "GitHub Actions".
# Without it, actions/deploy-pages fails with a bare 404 at deploy time.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # pages: write lets configure-pages enable Pages on a repo where it was
    # never turned on; id-token: write is what that action's API call signs with.
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      # Enables Pages if it is off, and pins the source to Actions. Only needed
      # on a real publish; PR builds just check that the site compiles.
      - name: Configure Pages
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/configure-pages@v5
        with:
          enablement: true
      # --strict fails the build on a broken internal link, so a doc move that
      # leaves a dangling reference is caught in the PR rather than on the site.
      - name: Build site
        run: mkdocs build --strict
      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only publish from main; PR builds stop at the --strict check above.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
