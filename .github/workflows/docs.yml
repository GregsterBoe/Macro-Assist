name: Docs

# Builds the MkDocs site from docs/ and publishes it to GitHub Pages.
#
# The markdown in docs/ is the single source of truth; this workflow only
# renders it. Nothing here authors content, so the site cannot drift from the
# repo the way a hand-maintained second copy would.
#
# ONE-TIME SETUP. Either of these, done once by a repo admin:
#
#   a) Settings -> Pages -> Build and deployment -> Source: "GitHub Actions"
#
#   b) If that page 404s or the dropdown will not stick, do the same thing
#      through the API, which needs no browser:
#
#        curl -X POST -H "Authorization: Bearer $PAT" \
#          -H "Accept: application/vnd.github+json" \
#          -H "Content-Type: application/json" \
#          https://api.github.com/repos/OWNER/REPO/pages \
#          -d '{"build_type":"workflow"}'
#
#      $PAT is a token with admin on this repo (classic: `repo`; fine-grained:
#      Pages read and write). Store that same token as the repository secret
#      PAGES_ADMIN_TOKEN and the preflight below does it for you on the next
#      run — that is the only way the workflow can enable Pages itself.
#
# The default GITHUB_TOKEN cannot. actions/configure-pages with enablement was
# tried (PR #23) and cannot work here: creating a Pages site is an admin-level
# API call and the Actions token is not a repo admin, so POST /repos/.../pages
# comes back "Resource not accessible by integration" however the permissions:
# block is written. Until Pages is on, the deploy job stops at the preflight
# below with an explicit message rather than at actions/deploy-pages with a
# bare 404.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - '.github/workflows/docs.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Rendering the site needs nothing but the source. The Pages scopes live on
    # the deploy job, which is the only place they are used.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - name: Install MkDocs
        run: pip install -r docs/requirements.txt
      # --strict fails the build on a broken internal link, so a doc move that
      # leaves a dangling reference is caught in the PR rather than on the site.
      - name: Build site
        run: mkdocs build --strict
      - name: Upload artifact
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    # Only publish from main; PR builds stop at the --strict check above.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # deploy-pages reports both "Pages is off" and "Pages is on but reads from
      # a branch" as an unexplained 404. Name the actual condition instead, and
      # fix it in place when an admin token is available.
      - name: Check Pages is configured
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional. A PAT with admin on this repo, which the Actions token is
          # not. When set, this step enables Pages (or switches it off a branch
          # source) by itself; when unset, it explains what to click instead.
          PAGES_ADMIN_TOKEN: ${{ secrets.PAGES_ADMIN_TOKEN }}
        run: |
          set -euo pipefail

          admin_token="${PAGES_ADMIN_TOKEN:-}"
          pages_api="${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/pages"
          settings="https://github.com/${GITHUB_REPOSITORY}/settings/pages"

          # call <method> <token> [json body] -> prints HTTP status,
          # response body lands in /tmp/pages.json
          call() {
            local method="$1" token="$2" body="${3:-}"
            if [ -n "$body" ]; then
              curl -sS -X "$method" -o /tmp/pages.json -w '%{http_code}' \
                -H "Authorization: Bearer $token" \
                -H "Accept: application/vnd.github+json" \
                -H "Content-Type: application/json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                -d "$body" "$pages_api"
            else
              curl -sS -X "$method" -o /tmp/pages.json -w '%{http_code}' \
                -H "Authorization: Bearer $token" \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "$pages_api"
            fi
          }

          # The manual remedy, printed whenever this step cannot fix things.
          how_to_fix="Set it once at ${settings} -> Build and deployment -> \
          Source: 'GitHub Actions'. If that page 404s, do the same over the API: \
          curl -X POST -H \"Authorization: Bearer \$PAT\" -H \"Content-Type: \
          application/json\" ${pages_api} -d '{\"build_type\":\"workflow\"}' \
          with a token that has admin on this repo, or store that token as the \
          PAGES_ADMIN_TOKEN secret and re-run this workflow."

          status=$(call GET "$GH_TOKEN")

          if [ "$status" = "404" ] && [ -n "$admin_token" ]; then
            echo "Pages is off; creating the site with PAGES_ADMIN_TOKEN."
            created=$(call POST "$admin_token" '{"build_type":"workflow"}')
            if [ "$created" = "201" ]; then
              echo "Created the Pages site with source 'GitHub Actions'."
              status=$(call GET "$GH_TOKEN")
            else
              cat /tmp/pages.json || true
              echo "::error title=PAGES_ADMIN_TOKEN could not enable Pages::\
          POST /pages returned HTTP ${created}. The token needs admin on this \
          repository (classic PAT: 'repo'; fine-grained: Pages read and write)."
              exit 1
            fi
          fi

          if [ "$status" = "404" ]; then
            echo "::error title=GitHub Pages is not enabled::${how_to_fix}"
            exit 1
          fi

          if [ "$status" != "200" ]; then
            echo "::warning::Could not read the Pages configuration (HTTP $status); \
          letting the deploy step report the real error."
            cat /tmp/pages.json || true
            exit 0
          fi

          # Only "legacy" is a proven misconfiguration. An absent or unexpected
          # build_type is not worth failing a deploy over, so it falls through.
          build_type=$(jq -r '.build_type // "unset"' /tmp/pages.json)

          if [ "$build_type" = "legacy" ] && [ -n "$admin_token" ]; then
            echo "Pages reads from a branch; switching it to GitHub Actions."
            switched=$(call PUT "$admin_token" '{"build_type":"workflow"}')
            if [ "$switched" = "204" ] || [ "$switched" = "200" ]; then
              echo "Switched the Pages source to 'GitHub Actions'."
              build_type=workflow
            else
              cat /tmp/pages.json || true
              echo "::warning::PAGES_ADMIN_TOKEN could not switch the Pages \
          source (HTTP ${switched}); falling through to the error below."
            fi
          fi

          if [ "$build_type" = "legacy" ]; then
            echo "::error title=Pages source is not GitHub Actions::\
          Pages is enabled but reads from a branch, so a workflow deployment is \
          rejected. ${how_to_fix}"
            exit 1
          fi

          echo "Pages is enabled (build_type: ${build_type})."
      - id: deployment
        uses: actions/deploy-pages@v4
