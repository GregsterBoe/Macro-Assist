name: Daily Macro Intelligence

on:
  # Scheduled as stage 2 of .github/workflows/pipeline.yml.
  workflow_call:
    inputs:
      force:
        description: "Overwrite today's note if it already exists"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      force:
        description: "Overwrite today's note if it already exists"
        type: boolean
        default: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  generate-note:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Macro-Assist (scripts)
        uses: actions/checkout@v4
        with:
          path: macro-assist
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Checkout External-Brain (vault)
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.VAULT_REPO }}   # e.g. GregsterBoe/External-Brain
          token: ${{ secrets.VAULT_PAT }}
          path: vault

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: macro-assist/.macro-assist/requirements.txt

      - name: Install dependencies
        run: pip install -r macro-assist/.macro-assist/requirements.txt

      - name: Mount output branch at results/
        run: |
          set -e
          cd macro-assist
          bash .macro-assist/ci_mount_output.sh

      - name: Generate macro note
        env:
          FRED_API_KEY:      ${{ secrets.FRED_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          VAULT_ROOT:        ${{ github.workspace }}/vault
          SUPADATA_API_KEY:  ${{ secrets.SUPADATA_API_KEY }}
          MACRO_PREVIEW:     "1"   # write results/llm_payload_preview/<date>.md
          # WP-16 experiment arm — set the repo variable MACRO_PROFILE to "loosened"
          # to switch the daily run for a period (alternate-in-time A/B). Default control.
          MACRO_PROFILE:     ${{ vars.MACRO_PROFILE || 'control' }}
          # IMP-4.3 OR recall-mode shadow record (KB-021). Default 'log': computed
          # daily and written to results/quant_context_log/ with ZERO note impact,
          # accumulating the live record. Escalate to 'show'/'active' — or 'off' to
          # stop — via the repo variable FRAGILITY_OR_MODE (no code edit needed).
          FRAGILITY_OR_MODE: ${{ vars.FRAGILITY_OR_MODE || 'log' }}
        run: python macro-assist/.macro-assist/collect_and_analyze.py ${{ inputs.force && '--force' || '' }}

      - name: Print LLM payload preview
        if: always()
        run: |
          PREVIEW="macro-assist/results/llm_payload_preview/$(date -u +%Y-%m-%d).md"
          if [ -f "$PREVIEW" ]; then
            echo "::group::LLM payload preview ($(date -u +%Y-%m-%d))"
            cat "$PREVIEW"
            echo "::endgroup::"
          else
            echo "No payload preview found at $PREVIEW (generation may have failed)."
          fi

      - name: Commit and push note to vault
        run: |
          set -e
          cd vault
          git config user.name  "macro-assist[bot]"
          git config user.email "macro-assist[bot]@users.noreply.github.com"
          git pull --rebase --autostash origin HEAD
          git add Economy/
          git diff --cached --quiet || git commit -m "macro: $(date -u +%Y-%m-%d) daily intelligence note"
          git push origin HEAD

      - name: Copy report to Macro-Assist results
        run: |
          set -e
          MONTH=$(date -u +%m-%B)
          FILENAME=$(date -u +%Y-%m-%d-%A)-macro.md
          YEAR=$(date -u +%Y)
          VAULT_FILE="vault/Economy/${YEAR}/${MONTH}/${FILENAME}"
          if [ ! -f "${VAULT_FILE}" ]; then
            echo "ERROR: expected report not found at ${VAULT_FILE}" >&2
            exit 1
          fi
          mkdir -p macro-assist/results/${MONTH}
          cp "${VAULT_FILE}" macro-assist/results/${MONTH}/${FILENAME}

      - name: Commit data to Macro-Assist (main)
        run: |
          set -e
          cd macro-assist
          git config user.name  "macro-assist[bot]"
          git config user.email "macro-assist[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "macro: $(date -u +%Y-%m-%d) daily data update"
          git pull --rebase --autostash origin $(git rev-parse --abbrev-ref HEAD)
          git push origin HEAD

      - name: Publish report to output branch
        run: |
          set -e
          cd macro-assist
          bash .macro-assist/ci_publish_results.sh "macro: $(date -u +%Y-%m-%d) daily intelligence note"
