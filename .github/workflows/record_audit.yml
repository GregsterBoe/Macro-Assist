name: Record Audit

# Runs `.macro-assist/record_audit.py` — the record layer's audit (Phase 24).
# It reads the workflows, the docs and the git history and exits non-zero on
# a red finding; it never writes. Today: every workflow is the pipeline entry
# point, a stage of it, dispatch-only, CI, or pinned soft-killed (ADR-0013,
# ADR-0015); the external schedule table in operations.md names only
# pipeline.yml; and every live track's artifact (ARTIFACTS in the script) has
# a last-changed commit younger than its cadence — on main and on the output
# branch, both of which fetch-depth: 0 brings in.
#
# The same checks run in the test suite (test_record_audit.py asserts this
# checkout is clean); this workflow is the copy that runs on every push and
# pull request, because nothing else in CI runs pytest.
#
# This file is itself classified by the check it runs: push / pull_request
# triggers make it CI, and it carries no `schedule:` — the audit would flag
# one here the same as anywhere else.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: record-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # WP-24.B (and later 24.E) read ages from git history, not mtimes,
          # on origin/main and origin/output. The audit refuses a shallow
          # clone outright — every age would be the clone boundary's.
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: pip install pyyaml pytest
      - name: Audit
        run: python .macro-assist/record_audit.py
      - name: Tests
        run: python -m pytest .macro-assist/tests/test_record_audit.py -q
